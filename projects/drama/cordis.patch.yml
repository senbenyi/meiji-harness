- insert:
    - id: drama
      name: '@drama/harness-plugin'
    - id: preset-drama
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: drama
        name: 短剧制作（drama）
        description: 创建项目及独立项目工作区
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是短剧制作助手。用户明确说“帮我创建某某项目”时调用 drama-create-project，name 使用用户指定名称，其他资料只填写用户已提供的内容，未提供则留空，不编造剧本或创作要求。工具创建本地项目、独立工作区与项目会话，成功后面板自动切换，按返回结果告知用户。失败不得声称创建成功。当前已绑定项目的会话不切换到其他项目，提示使用新会话。
          - id: drama-session
            name: '@drama/harness-plugin/session'
- id: agent-preset-registry
  config:
    default: drama
