<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>短剧工作台</title>
  <script>
    /* 首屏前定主题，避免「先闪一下浅色再变深色」。
       宿主（lib/client.js）把 DSH 当前的浅/深写进 ?theme=；没有该参数时（宿主没装主题服务，
       或本页被单独打开）退回系统偏好。运行中宿主切换主题由 app.js 的 message 监听接手。 */
    (function () {
      var t = null
      try { t = new URLSearchParams(location.search).get('theme') } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = (typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'
      }
      document.documentElement.setAttribute('data-theme', t)
    })()
  </script>
  <link rel="stylesheet" href="./app.css?v=13">
</head>
<body>
  <script>window.__DSH_SVS_TOKEN__ = "__DSH_SVS_TOKEN_VALUE__";</script>
  <header class="topbar">
    <div class="brand" id="project-title">短剧工作台</div>
    <div class="meta" id="meta"></div>
    <div class="topbar-bar">
      <button class="btn" id="refresh" type="button">刷新</button>
    </div>
  </header>
  <nav id="stage-tabs" class="stage-tabs" role="tablist" aria-label="制作阶段"></nav>
  <div id="asset-tools" class="asset-tools" hidden>
    <button class="btn" id="add-upload" type="button">上传图片</button>
    <button class="btn" id="add-assets" type="button" title="跨项目使用的公共素材">公共素材库</button>
  </div>
  <button id="updates" class="update-notice" type="button" hidden>内容已更新，点击查看</button>
  <main id="canvas" class="canvas" role="tabpanel" aria-label="项目总览"></main>
  <button id="jump" class="jump-btn" type="button" title="返回顶部">↑ 返回顶部</button>
  <script type="module" src="./app.js?v=13"></script>
</body>
</html>
