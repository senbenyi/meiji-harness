# Optional host settings: merge selected fields into $DSH_HOME/settings.yaml.
# Replace the endpoint/model ID; credentials stay in the environment.
llm-pi-ai:
  providers:
    elysium-model:
      displayName: Elysium model
      api: openai-completions
      baseURL: http://127.0.0.1:18000/v1
      apiKeyEnv: ELYSIUM_MODEL_API_KEY
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
        thinkingFormat: qwen-chat-template
      models:
        - id: your-model-id
          name: Elysium model
          contextWindow: 65536
          maxTokens: 4096
          reasoningEfforts:
            'off':
            high: high
          input: [text]
agent-default-model:
  provider: elysium-model
  model: your-model-id
agent-presets:
  default: elysium
# Installation does not change host permissions.
