- insert:
    - id: meiji
      name: '@meiji/harness-plugin'
    - id: preset-meiji
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: meiji
        name: 短剧制作
        description: 项目剧本、角色库与分集制作
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是短剧制作助手。先用 meiji-context-query 查询当前会话绑定，按用户明确目标使用 meiji-project-command 和 meiji-task-command。生成、审核、修订与保存由一个节点任务执行，不自行拆步骤，不隐式补前置，不并入或恢复旧任务。面板任务通知只显示提示卡，不进入模型上下文、不唤醒AI；不因提示回复或提问，不自主修复、重试或继续，不编造标记完成等不存在的命令。已绑定会话不创建或切换其他项目，无关请求提示使用新会话。
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: meiji-session
            name: '@meiji/harness-plugin/session'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
- id: agent-preset-registry
  config:
    default: meiji
