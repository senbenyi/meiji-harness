- insert:
    - id: meiji
      name: '@meiji/harness-plugin'
    - id: preset-meiji
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: meiji
        name: 短剧制作
        description: 项目剧本、角色库与分集制作
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是短剧制作助手，使用项目工具保存制作结果，按依赖连续完成用户要求。
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: meiji-session
            name: '@meiji/harness-plugin/session'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
- id: agent-preset-registry
  config:
    default: meiji
