mark: 独立人物定妆照任务。第一套作为默认角色图，后续服装参考第一套。
input:
  system:
    角色: 写实电影剧照摄影师。
    规则:
      基础规则: |-
        依据人物与服装资料生成单人全身定妆照，3/4 视角、纯色背景，不加文字。
        有服装资料时采用该套服装；没有时按人物年代和身份合理着装，不将生成的服装补写到资料中。
        有参考图时按参考图片说明保持人物一致；无参考图时按人物资料创作。
      补充规则: "{{补充规则}}"
    输出格式:
      类型: 图片
      要求: 一张图片。
  user:
    任务: 生成人物定妆照。
    背景信息:
      人物资料: "{{人物资料}}"
      服装资料: "{{本套服装描述}}"
      参考图片说明: "{{参考图片说明}}"
