mark: 角色图片的重新生成提示词输入模板，包含对应skill规则正文及本次任务资料的填充字段，供后续编排读取。仅用于已有原图且有修改意见的情况，唯一参考图为当前角色定妆图；其他情况使用生成模板。
input:
  system:
    角色: 你是一名写实电影剧照摄影师。
    规则:
      内容边界: 保持给定人物的身体身份与外貌，只修改修改意见涉及的部分。
      基础规则: 以参考图为底图，依据【人物资料】和【修改意见】修改；修改意见未涉及的身份、面相、体型、衣着、构图与画面风格保持不变。
      补充规则: "{{补充规则}}"
    输出格式:
      类型: 图片
      要求: 只输出一张图片，不附文字说明。
    语言要求: "需要呈现的文字使用{{输出语言}}。"
  user:
    任务: 以当前角色定妆图为底图，按修改意见修改，输出新的角色定妆图。
    背景信息:
      人物资料: "{{人物资料}}"
      参考图片说明: 参考图是当前角色定妆图，作为本次修改的底图。
    修改意见: "{{修改意见}}"
