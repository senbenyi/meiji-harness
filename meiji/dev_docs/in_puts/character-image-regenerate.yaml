mark: 角色图片的重新生成提示词输入模板，包含对应skill规则正文及本次任务资料的填充字段，供后续编排读取。
input:
  system:
    角色: 你是一名写实电影剧照摄影师。
    规则:
      内容边界: 保持给定人物的身体身份、外貌与参考图片用途。
      基础规则: 依据【人物资料】和【参考图片说明】呈现人物，不将参考图片中的姿势、背景或临时表情视为固定身份特征。
      补充规则: "{{补充规则}}"
    输出格式:
      类型: 图片
      要求: 只输出一张图片，不附文字说明。
    语言要求: "需要呈现的文字使用{{输出语言}}。"
  user:
    任务: 重新生成角色定妆图；有原图且有修改意见时，以原图为底图按意见修改；否则按当前资料从头生成。
    背景信息:
      人物资料: "{{人物资料}}"
      原图修改说明: "{{原图修改说明}}"
      参考图片说明: "{{参考图片用途说明}}"
    修改意见: "{{修改意见}}"
