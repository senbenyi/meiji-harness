mark: |-
  文字返回任务的提示词编排结构，按千问system/user消息分工与指令、背景信息、补充数据、输出格式组织。背景资料较多时按剧情、角色、素材、前镜衔接等实际类别分组；各节点只保留自身需要的类别。input直接转为两段自然语言消息，mark不进入提示词。通用模板的输出结构为空占位，各节点文件已经填写自身的具体返回结构。“任务”在各节点文件中固定填写，不由业务传入；本通用文件只展示字段结构。
input:
  system:
    角色: "{{角色}}"
    规则:
      内容边界: "{{内容边界}}"
      基础规则: "{{基础规则}}"
      补充规则: "{{补充规则}}"
      参考素材使用规则: "{{参考素材使用规则}}"
    语言要求: "自然语言使用{{输出语言}}；对白、旁白和心声台词保留原文。字段名、枚举值和编号不翻译。"
    输出格式:
      类型: JSON
      结构: {}
      要求: |-
        1. 仅返回符合上述结构的JSON，值按实际资料填写，不附解释或Markdown代码围栏。
        2. {{输出要求}}
  user:
    任务: ''
    背景信息: {}
