mark: |-
  视频AI提示词通用编排结构；仅定义共享编排字段，生成与重新生成的专属字段按各独立输入文件定义。“任务”在各节点文件中固定填写，不由业务传入；本通用文件只展示字段结构。
input:
  system:
    角色: "{{角色}}"
    规则:
      内容边界: "{{内容边界}}"
      基础规则: "{{基础规则}}"
      补充规则: "{{补充规则}}"
    输出格式:
      类型: 视频
      要求: 只输出本镜视频，不附文字说明。
    语言要求: "对白、旁白和心声台词保留原文，其他文字使用{{输出语言}}。"
  user:
    任务: ''
    背景信息:
      已审核文本提示词: "{{文本提示词}}"
      开场衔接说明: "{{开场衔接}}"
      参考图片说明: "{{参考图片用途说明}}"
