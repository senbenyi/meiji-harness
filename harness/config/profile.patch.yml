# 精简控制：通过硬性约束减少输出长度。
- id: compaction-basic
  config:
    maxResponseTokens: 1000

- id: system-prompt
  config:
    persona: >-
      You are a concise coding agent.
      RULES:
      1. Max 500 words per response.
      2. Use bullet points for clarity.
      3. No fluff, no filler, no unnecessary explanations.
      4. Output only key findings, code changes, and final conclusions.
      5. Skip intermediate reasoning unless explicitly requested.

# 隐藏内置预设（PTC、极简、创造），只显示自定义的 4 个。
- id: agent-presets
  config:
    default: elysium-teaching
    includeShippedRoot: false

# ComfyUI 地址按实际部署修改。
- id: dsh-elysium-tools
  config:
    comfyUrl: http://127.0.0.1:8188
