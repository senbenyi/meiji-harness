# 精简控制：通过硬性约束减少输出长度。
- id: compaction-basic
  config:
    # 回复长度的硬性限制（Token 数），防止啰嗦。
    maxResponseTokens: 1000

- id: system-prompt
  config:
    persona: >-
      你是一个简洁高效的编程助手。
      规则：
      1. 每次回复不超过 500 字。
      2. 使用项目符号以保持清晰。
      3. 杜绝废话、冗余内容及不必要的解释。
      4. 仅输出关键发现、代码变更及最终结论。
      5. 除非明确要求，否则跳过中间推理过程。

# 插件通过服务器 URL 访问 ComfyUI，不使用本地媒体地址。
- id: dsh-elysium-tools
  config:
    comfyUrl: https://36we4j3zo503js-8188.proxy.runpod.net
