# Web Profile 组合配置：定义插件装配、初始化参数与能力边界。

# 系统提示词。
- id: system-prompt
  config:
    persona: >-
      你是一个视频创作助手。每次回复简洁高效不超过 500 字，跳过中间推理过程，杜绝废话、冗余内容及不必要的解释。

# Elysium 插件装配。
- insert:
    - id: dsh-elysium
      name: '@dsh-external/dsh-elysium'

# 预设来源策略：只发现本机维护的 Elysium 预设。
- id: agent-presets
  config:
    default: elysium-free
    includeShippedRoot: false

# Web 能力边界：关闭反馈、日志导出与权限切换。
- id: command-feedback
  disabled: true
- id: session-log-download
  disabled: true
- id: permission
  isolate:
    commands: true
- id: ui-permission
  disabled: true
