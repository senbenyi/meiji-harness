- id: system-prompt
  config:
    persona: >-
      你是一个简洁高效的编程助手。
      规则：
      1. 每次回复不超过 500 字。
      2. 使用项目符号以保持清晰。
      3. 杜绝废话、冗余内容及不必要的解释。
      4. 仅输出关键发现、代码变更及最终结论。
      5. 除非明确要求，否则跳过中间推理过程。

# Web 端不收集会话反馈。
- id: command-feedback
  disabled: true

# 插件通过服务器 URL 访问 ComfyUI，不使用本地媒体地址。
- insert:
    - id: dsh-elysium
      name: '@dsh-external/dsh-elysium'
      config:
        comfyUrl: !!js process.env.COMFYUI_URL
