# 用户运行设置：配置已挂载插件的模型、默认项与界面偏好。

# 模型提供方与模型目录。
llm-pi-ai:
  providers:
    qwen38-local:
      displayName: qwen3.8
      baseURL: http://127.0.0.1:18000/v1
      apiKeyEnv: QWEN38_LOCAL_API_KEY
      api: openai-completions
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
        thinkingFormat: qwen-chat-template
      models:
        - id: qwen3.8-27b-elysium
          name: qwen3.8
          contextWindow: 262144
          maxTokens: 32768
          reasoningEfforts:
            'off':
            high: high
          input:
            - text

# 默认项。
# 新会话默认使用经本机转发的 Qwen 模型。
agent-default-model:
  provider: qwen38-local
  model: qwen3.8-27b-elysium

# 本机开发 Harness 默认权限；不要复制到远端模型服务器。
permission:
  defaultPreset: danger-full-access

# 新会话统一使用项目视频创作入口。
agent-presets:
  default: elysium-creation

# 界面与交互偏好。
# 显示浏览器/Git 标签，并允许 Agent 主动打开工具界面。
dsh-better-sidebar:
  tabsEnabled:
    browser: true
    git: true
  agentOpenTools: true

# Agent 忙碌时按 Enter 将新消息作为 steer 发送。
ui-conversation:
  busyEnter: steer
