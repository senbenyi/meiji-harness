# `standard` Agent 预设：完整编码 Agent，每个进程只挂载一次。
# 本文件是 Agent 平面的 composition。roster 在常驻 scope 下只挂载一次；使用本预设的
# 每个会话通过 scope 父子关系加入，因此这里注册的工具和提示词会覆盖所有加入的 Agent，
# 而各插件仍按 Session/Agent 隔离会话状态。主机 composition（`base.cordis.yml` +
# `web.cordis.yml`）负责预设不应持有的能力：registry、沙箱与审批栈、持久化和模型路由。
#
# 本文件中的服务项必须位于带 `isolate` realm 的 group 内。否则服务会发布到进程全局的
# root realm：其他预设发布同名服务时会冲突，主机读取方也会让所有会话解析到同一个预设
# 实例，`dsh-agent-presets` 会在挂载时拒绝这种配置。`true` 表示条目局部 realm，即本次
# 常驻挂载独有的私有实例，与其他预设隔离。共享标签不会合并实例；同一 realm symbol 下
# 第二次注册会使 `provide()` 抛错。标签用于连接 realm，不适合这里的隔离需求。

# ── 身份与指令 ─────────────────────────────────────────────────────────────

# 本预设的人格会覆盖该 Agent 的部署默认人格。
# `{{model}}` 与 `{{cwd}}` 分别从 Agent 自身的模型路由和工作区解析。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      你是由 {{model}} 模型驱动的编码 Agent。当前工作目录是 {{cwd}}。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── Shell 工具 ──────────────────────────────────────────────────────────────

# `shell-env` 保留在主机 composition：`apps/cli/src/web.ts` 注入它以发布
# `DSH_WEB_URL`/`DSH_WEB_MODE`。注入服务的主机项归主机平面所有，因为注入发生在任何
# 会话创建之前，此时还没有可用于隔离的 Agent。若放入预设 realm，这些变量无法传到模型
# Shell。这里的两个 Shell 工具使用主机 registry；其执行器 `bash-sandbox` 和
# `pwsh-sandbox` 也属于主机平面。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── 文件系统 ────────────────────────────────────────────────────────────────

# 两个工具都注册到主机 `tools` registry 且不提供服务，因此不需要 realm。
# `fs` 服务及其策略保留在主机平面。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── 后台任务 ────────────────────────────────────────────────────────────────

# 此处只注册面向模型的控制工具。任务 registry 保留在主机平面：其生产者位于本文件可创建
# 的 realm 之外，上面的 `tool-bash` 通过 `ctx.get` 解析它；条目局部 realm 对同级项不可见，
# 否则即使目录中存在控制工具，`run_in_background` 仍会返回“后台任务不可用”。registry
# 本身按所属 Agent 分区，因此一个主机实例即可服务所有会话。预设只决定 Agent 能否收集
# 和停止后台任务。
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── 技能 ────────────────────────────────────────────────────────────────────

# 技能 registry 位于主机 composition，并按 scope 分层；以下条目注册到本预设对应的层，
# 因此不需要 realm。`skill-filesystem` 为本预设的 Agent 提供本地根目录发现能力，
# `tool-skill` 提供技能目录和加载器；合并后的目录也包含部署时全局注册的仓库插件。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    agentsHome: !!js process.getBuiltinModule('node:url').fileURLToPath(new URL('../../agents/', baseUrl))

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 目标 ────────────────────────────────────────────────────────────────────

# 目标服务和会话驱动保留在主机平面，供 Gateway 解析；面向模型的工具注册到本预设的
# scope 层，面向用户的 /goal 指令保持禁用。
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'
  disabled: true

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── 计划模式 ────────────────────────────────────────────────────────────────

# 计划状态天然属于单个 Agent，因此条目局部 realm 正是所需生命周期，并非兼容性变通。
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              你处于计划模式。在 exit_plan_mode 成功或用户切换会话模式前，必须保持计划模式。用户用祈使语气要求实施时，只规划实施方案，不执行修改。用户在对话中表示同意，包括确认你提出的问题，并不构成计划批准，也不会结束计划模式；应将确认的决定纳入计划，并通过 exit_plan_mode 提交。
              先调研。使用只读检查、搜索、静态分析和验证，让计划建立在真实仓库状态上。不得编辑或写入文件、修改配置、运行会重写受 Git 管理文件的格式化或代码生成命令、提交代码，或以其他方式执行计划。优先复用现有函数和模式，不引入新的机制。
              为保持请求缓存稳定，各模式的工具目录不变。这些计划模式规则优先于后续任何建议使用写入工具的工具说明或指引；相关工具仍会列出，只是为了保持目录不变。不要用 todo_write 跟踪规划阶段：它用于跟踪计划获批后的实施，计划本身应提交给 exit_plan_mode。
              通过检查解决可发现的事实。只有用户必须亲自决定，或检查无法消除重大歧义时，才使用 ask_user_question。能够自行查明代码位置或当前行为时，不要询问用户。
              计划必须完整到无需再次决策：说明目标和成功标准；按子系统组织实施改动；指出公共 API、schema 和数据流变化；覆盖边界情况、失败模式、测试、验收标准及明确假设。内容应便于审阅，同时详细到其他工程师无需再做设计决策即可实施。
              准备完成后，调用 exit_plan_mode 提交完整的 Markdown 计划，并以 # 标题开头。在该次回复中，exit_plan_mode 必须是唯一且最后一个工具调用：它负责展示计划以供审批，只有获批后的后续步骤才能开始实施。不要把最终计划直接粘贴为普通回复，也不要通过文字或 ask_user_question 询问“是否继续”。若审阅拒绝计划，应吸收反馈后重新提交。若审阅通道不可用或中止，应保持计划模式并请用户手动切换模式，不得开始实施。

# ── 上下文压缩 ─────────────────────────────────────────────────────────────

# `compaction-basic` 通过 `ctx.get` 读取 `toolResultPrune`，因此裁剪器必须共享此 realm，
# 不能放在 realm 外。
#
# `tokenMeter` 特意不放入此 realm：计量器保留在主机平面，以下条目解析同一个实例。它无需
# 配置，按 Session 区分每次 fold，并持有浏览器为所有会话读取的上下文计量投影单元；若放入
# realm，这些单元会随预设挂载和卸载而变化。预设只决定其 Agent 是否启用压缩，即下面的
# `compaction-basic`。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── 委派与工作流 ────────────────────────────────────────────────────────────

# `subagents` registry 及其 spawn/fork 后端位于主机 composition：该 registry 是进程级
# 单例，api-proxy 会把跨会话查询提供给浏览器，而且每个 provider 名只能注册一次。
# 本预设只提供委派工具，由这些工具解析主机 registry。
#
# `workflows` 不同：Agent 外部没有组件读取它，因此所有访问它的条目在此共享一个条目局部
# realm；若消费者留在 realm 外，会解析到本预设并未填充的主机 registry。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    # 分叉（fork）不提供模型选择，使 provider/model 与父 Agent 保持一致，并让继承的历史仍可复用
    # KV Cache。本预设允许 fork 继续运行；父子 Agent 继承同一消息工具，父 ID 与返回指引
    # 随历史一并继承。
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # 生产版 dsh 不安装以下可选 provider。需先在当前 Profile 安装对应 Bundle 并重启主机，
    # 再复制本预设并移除相应工具项的 `disabled`。主机可用不代表自动授予工具。
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── 其他面向模型的工具 ──────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# `web` 服务及其搜索 provider 保留在主机 composition；只有面向模型的工具按会话隔离。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
