<!doctype html><html lang="zh"><head><meta charset="utf-8">
<style>
  :root{--dsw-alias-bg-base:#151517;--dsw-alias-bg-layer-1:#232324;--dsw-alias-label-primary:#f9fafb;--dsw-alias-label-secondary:#cfd3d6;--dsw-alias-label-caption:#adb2b8;--dsw-alias-border-l1:#ffffff0f;--dsw-alias-border-l2:#ffffff1f;--dsw-alias-interactive-bg-hover:#ffffff14;--dsw-alias-state-error-primary:#f25a5a;--dsw-alias-state-business-primary:#5b8cff}
  html,body{margin:0;padding:0;background:var(--dsw-alias-bg-base)}
  body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--dsw-alias-label-primary)}
  /* 模拟 DSH 设置面板的可用宽度：外面给固定宽，里面是插件自己的容器 */
  .pane{width:760px;box-sizing:border-box;border-right:1px dashed #c9ced6}
  input,select,textarea,button{font:inherit;color:inherit}
  select,input[type=text],input[type=password],textarea{background:#fff}
  /* 给可滚动/可裁剪元素加可见提示，便于发现溢出 */
  .pane *{outline-offset:-1px}
</style></head><body><div class="pane"><div style="padding:16px;max-width:620px;width:100%;box-sizing:border-box;min-width:0px"><h3 style="margin-top:0px">ComfyUI</h3><label style="display:grid;grid-template-columns:140px minmax(0, 1fr);gap:10px;align-items:center;margin:10px 0;min-width:0px"><span style="font-size:13px">画布显示位置</span><select style="width:100%;max-width:100%;min-width:0px;box-sizing:border-box;height:34px;padding:0 10px;border-radius:6px;border:1px solid var(--dsw-alias-border-l2, #d9d9d9);background:var(--dsw-alias-bg-base, #fff);color:var(--dsw-alias-label-primary, #1f2329)" value="tab" data-value="tab"><option value="tab" value="tab" selected>会话标签页（默认）</option><option value="sidebar" value="sidebar">右侧栏</option></select></label><div style="display:flex;align-items:center;gap:10px;margin:4px 0 20px 150px;flex-wrap:wrap"><span style="font-size:12px;color:var(--dsw-alias-label-secondary, #646a73)">切换后刷新页面生效。</span><button style="height:28px;padding:0 10px;border-radius:6px;cursor:pointer;border:1px solid var(--dsw-alias-border-l2, #d9d9d9);background:var(--dsw-alias-bg-base, #fff);color:var(--dsw-alias-label-primary, #1f2329);font-size:12px" type="button">刷新页面</button></div><label style="display:grid;grid-template-columns:140px minmax(0, 1fr);gap:10px;align-items:center;margin:10px 0;min-width:0px"><span style="font-size:13px">ComfyUI 地址</span><input style="width:100%;max-width:100%;min-width:0px;box-sizing:border-box;height:34px;padding:0 10px;border-radius:6px;border:1px solid var(--dsw-alias-border-l2, #d9d9d9);background:var(--dsw-alias-bg-base, #fff);color:var(--dsw-alias-label-primary, #1f2329)" type="text" value="http://43.154.247.11/comfy"></label><label style="display:grid;grid-template-columns:140px minmax(0, 1fr);gap:10px;align-items:center;margin:10px 0;min-width:0px"><span style="font-size:13px">API Key（可留空）</span><input style="width:100%;max-width:100%;min-width:0px;box-sizing:border-box;height:34px;padding:0 10px;border-radius:6px;border:1px solid var(--dsw-alias-border-l2, #d9d9d9);background:var(--dsw-alias-bg-base, #fff);color:var(--dsw-alias-label-primary, #1f2329)" type="password" value=""></label><div style="display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap"><button style="height:34px;padding:0 14px;border-radius:6px;cursor:pointer;border:1px solid var(--dsw-alias-border-l2, #d9d9d9);background:var(--dsw-alias-bg-base, #fff);color:var(--dsw-alias-label-primary, #1f2329)" type="button">保存</button><span style="font-size:12px;color:var(--dsw-alias-label-secondary, #646a73);overflow-wrap:anywhere"></span></div></div></div></body></html>
