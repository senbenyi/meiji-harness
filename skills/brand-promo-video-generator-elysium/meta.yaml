summary-en: Turn verified brand assets and a campaign goal into a promotional short: brand truth sheet, provenance manifest, story spine, beat shot table, per-shot clips, and final assembly.
summary-cn: 基于可核验的品牌素材与推广目标，完成事实核验、来源清单、创意方向、镜头表、逐镜生成与成片合成，输出品牌宣传短片。
desc-en: Creates a promotional short from verified brand assets using only the active Elysium Qwen Image 2.1 and MiniMax H3 workflow families, without archived continuity, frame-extraction, or upscaling capabilities.
desc-cn: 基于可核验品牌素材，仅使用活动的 Elysium Qwen Image 2.1 与 MiniMax H3 工作流完成生成与交付；不声明已归档的续接、抽帧或超分能力。
