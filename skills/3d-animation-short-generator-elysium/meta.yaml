summary-en: Create a unified 3D animated short from a story idea, covering characters, scenes, shots, storyboards, video clips, and final assembly.
summary-cn: 根据故事创意完成角色场景设定、镜头规划、分镜生成与视频合成，输出风格统一的3D动画短片。
desc-en: Produces a stylized 3D animated short using only the verified Elysium Qwen Image 2.1 and MiniMax H3 workflow families, without claiming archived continuity, frame-extraction, or upscaling workflows.
desc-cn: 仅使用已验证的 Elysium Qwen Image 2.1 与 MiniMax H3 工作流完成资产、镜头规划、逐镜生成、拼接与终检；不声明已归档的 latent 续接、抽帧或超分能力。
