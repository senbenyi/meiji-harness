# dsh-elysium bundle patch
- insert:
    - id: dsh-elysium
      name: '@dsh-external/dsh-elysium'
      config:
        workspace: '/Users/mac/.dsh/profiles/web/data/elysium'
        comfyui:
          baseUrl: 'http://127.0.0.1:8189'
          templatesDir: '/Users/mac/.dsh/profiles/web/data/elysium/comfyui/templates'
          outputDir: '/Users/mac/.dsh/profiles/web/data/elysium/comfyui/output'
        models:
          characterImage:
            template: 'qwen-image-t2i'
            args:
              width: 768
              height: 1024
          shotImage:
            template: 'qwen-image-t2i'
            args:
              width: 1280
              height: 720
          shotVideo:
            template: 'wan22-remix-long'
            args: {}
        ffmpeg: 'ffmpeg'
        ffprobe: 'ffprobe'
