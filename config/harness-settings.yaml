# 启动与隧道参数
harness-runtime:
  HARNESS_ROOT: /root/autodl-tmp/wan22-harness
  PLUGINS_ROOT: /root/autodl-tmp/project/harness
  PROJECT_ROOT: /root/autodl-tmp/project/harness
  COMFYUI_INPUT_ROOT: /root/ComfyUI/input
  QWEN_SSH_TARGET: veo-qwen38
  QWEN_API_LOCAL_PORT: 18000
  QWEN_API_REMOTE_PORT: 8000
  QWEN_MODEL_ID: qwen3.8-27b-elysium
  HARNESS_WEB_PORT: 3080
  HARNESS_LOCAL_PORT: 23080

# 模型服务
llm-pi-ai:
  providers:
    qwen-token-plan-cn:
      apiKeyEnv: QWEN_TOKEN_PLAN_CN_API_KEY
    qwen38-local:
      displayName: qwen3.8-27b-elysium
      api: openai-completions
      baseURL: http://127.0.0.1:__QWEN_API_LOCAL_PORT__/v1
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
        thinkingFormat: qwen-chat-template
      models:
        - id: __QWEN_MODEL_ID__
          name: qwen3.8-27b-elysium
          contextWindow: 65536
          maxTokens: 4096
          reasoningEfforts:
            'off':
            high: high
          input:
            - text
      apiKeyEnv: QWEN38_LOCAL_API_KEY

ui-theme:
  preference: system

agent-default-model:
  provider: qwen38-local
  model: __QWEN_MODEL_ID__

dsh-better-sidebar:
  tabsEnabled:
    browser: true
    git: true
  agentOpenTools: true

dsh-elysium-ui:
  enabled: true
  directors: []

ui-conversation:
  busyEnter: steer

permission:
  defaultPreset: danger-full-access

ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-presets:
  default: elysium

# 启动前生成并覆盖配置；不写入会话、工作区数据和密钥。
harness-customization:
  systemPromptFile: system-prompt.yaml
  instructionsFile: harness-agent.md
  profile:
    - insert:
        - id: dsh-image-preview
          name: dsh-image-preview
    - id: system-prompt
  agent:
    base: standard
    metadata:
      name: 极乐世界
      description: AI 短剧助手：文件、Shell、检索、计划、目标、子代理、创作及媒体工作流。
    patches:
      - id: skill-filesystem
        config:
          customSkillDirs:
            - /root/autodl-tmp/project/harness/.dsh/skills
      - id: persona
        disabled: true
